<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yrityksen Nimi</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: #f9fbfc; color: #111; }
    header { background: #1e3a8a; color: white; text-align: center; padding: 4rem 2rem; position: relative; }
    header h1 { font-size: 2.5rem; margin-bottom: 1rem; }
    header p { font-size: 1.2rem; }
    .cta-buttons a {
      display: inline-block; background: #facc15; color: black;
      padding: 0.75rem 1.5rem; margin: 1rem; font-weight: bold;
      border-radius: 8px; text-decoration: none;
    }
    .language-switcher {
      position: absolute; top: 1rem; right: 1rem;
    }
    .language-switcher button {
      background: transparent; color: white; border: 2px solid white;
      padding: 0.25rem 0.75rem; margin-left: 0.5rem; border-radius: 5px;
      cursor: pointer; font-weight: 600;
    }
    main { padding: 2rem; max-width: 900px; margin: auto; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 2rem; }
    .gallery img { width: 100%; border-radius: 8px; }
    .logo { width: 150px; height: auto; margin: 1rem auto; display: block; }
    .contact-info { background: #1e3a8a; color: white; padding: 2rem; border-radius: 12px; text-align: center; margin-top: 3rem; }
    .contact-info p { margin: 0.5rem 0; }
     /* Social Media Footer */
     .footer {
      text-align: center;
      padding: 20px 0;
      font-size: 20px;
    }

    .footer a {
      margin: 0 10px;
      text-decoration: none;
      display: inline-block;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      line-height: 40px;
      text-align: center;
      color: white;
    }

    .fab {
      position: center;
      text-align: center;
      text-decoration: none;
      border-radius: 10px;
    }


    /* Social Media Icon Colors */
    .fa-facebook {
      background: #3B5998;
    }

    .fa-youtube {
      background: #ff0000;
    }

    .fa-instagram {
      background: #E1306C;
    }

    .fa-spotify {
      background: black;
      color: #81b71a;
    }

    /* Hover effect */
    .fab:hover {
      opacity: 0.7;
    }
    @media (max-width: 600px) {
      header h1 { font-size: 2rem; }
      .cta-buttons a { margin: 0.5rem 0; display: block; }
      .language-switcher { position: static; margin-top: 1rem; }
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header>
    <div class="language-switcher">
      <button onclick="setLanguage('fi')">Suomeksi</button>
      <button onclick="setLanguage('en')">In English</button>
    </div>
    <img src="" alt="Yrityksen logo" class="logo">
    <h1 data-fi="Yrityksen Nimi" data-en="Company Name">Yrityksen Nimi</h1>
    <p data-fi="Lyhyt kuvaus siitä mitä yritys tekee" data-en="A short description of what the company does">Lyhyt kuvaus siitä mitä yritys tekee</p>
    <div class="cta-buttons">
      <a href="mailto:esimerkki@yritys.fi" data-fi="Lähetä sähköpostia" data-en="Send Email">Lähetä sähköpostia</a>
      <a href="tel:+358401234567" data-fi="Soita nyt" data-en="Call Now">Soita nyt</a>
    </div>
  </header>

  <main>
    <h2 data-fi="Esittelykuvat" data-en="Showcase Images">Esittelykuvat</h2>
    <div class="gallery">
      <img src="https://via.placeholder.com/400x300?text=Kuva+1" alt="Kuva 1">
      <img src="https://via.placeholder.com/400x300?text=Kuva+2" alt="Kuva 2">
      <img src="https://via.placeholder.com/400x300?text=Kuva+3" alt="Kuva 3">
      <img src="https://via.placeholder.com/400x300?text=Kuva+4" alt="Kuva 4">
    </div>

    <div class="contact-info">
      <h2 data-fi="Yhteystiedot" data-en="Contact Info">Yhteystiedot</h2>
      <p><strong data-fi="Nimi:" data-en="Name:">Nimi:</strong> Etunimi Sukunimi</p>
      <p><strong data-fi="Y-tunnus:" data-en="Business ID:">Y-tunnus:</strong> 1234567-8</p>
      <p><strong data-fi="Sähköposti:" data-en="Email:">Sähköposti:</strong> esimerkki@yritys.fi</p>
      <p><strong data-fi="Puhelin:" data-en="Phone:">Puhelin:</strong> +358 40 123 4567</p>
    </div>
  </main>

  <!-- Footer with Social Links -->
  <!-- Footer Section -->
  <footer class="footer">
    <a href="https://www.facebook.com/yourpage" target="_blank" class="fab fa-facebook"></a>
    <a href="https://www.youtube.com/c/yourchannel" target="_blank" class="fab fa-youtube"></a>
    <a href="https://www.instagram.com/yourprofile" target="_blank" class="fab fa-instagram"></a>
    <a href="https://spotify.com/yourartistpage" target="_blank" class="fab fa-spotify"></a>
    <br>
    <br>
    &copy; 2025 <span data-fi="Yrityksen Nimi" data-en="Company Name">Yrityksen Nimi</span>. <span data-fi="Kaikki oikeudet pidätetään." data-en="All rights reserved.">Kaikki oikeudet pidätetään.</span>
  </footer>

  <script>
    function setLanguage(lang) {
      document.querySelectorAll('[data-fi]').forEach(el => {
        el.textContent = el.getAttribute(`data-${lang}`);
      });
    }
  </script>
</body>
</html>
